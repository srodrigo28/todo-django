<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuração de cores -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7c3aed', // roxo
                        dark: '#0f0f14',
                        card: '#18181f',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-dark text-gray-200 min-h-screen">

    <!-- Container -->
    <div class="max-w-4xl mx-auto p-6">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <h1 class="text-3xl font-bold text-white">
                📋 Tarefas
            </h1>

            <a href="{% url 'nova_tarefa' %}"
               class="inline-flex items-center justify-center px-5 py-2 rounded-lg
                      bg-primary hover:bg-purple-700 transition
                      text-white font-semibold shadow-lg">
                + Nova Tarefa
            </a>
        </div>

        <!-- Lista -->
        <ul class="space-y-4">
            {% for tarefa in tarefas %}
            <li class="bg-card border border-gray-700 rounded-xl p-5
                       flex flex-col md:flex-row md:items-center md:justify-between
                       gap-4 hover:border-primary transition">

                <!-- Info -->
                <div>
                    <h2 class="text-xl font-semibold text-white">
                        {{ tarefa.titulo }}
                    </h2>
                    <p class="text-gray-400 text-sm mt-1">
                        {{ tarefa.descricao }}
                    </p>

                    {% if tarefa.finalizado %}
                        <span class="inline-block mt-2 px-3 py-1 text-xs rounded-full
                                     bg-green-600/20 text-green-400">
                            ✔ Finalizada
                        </span>
                    {% else %}
                        <span class="inline-block mt-2 px-3 py-1 text-xs rounded-full
                                     bg-yellow-600/20 text-yellow-400">
                            ⏳ Pendente
                        </span>
                    {% endif %}
                </div>

                <!-- Ações -->
                <div class="flex gap-3">
                    <a href="{% url 'detalhes_tarefa' tarefa.id %}"
                       class="px-4 py-2 rounded-lg border border-primary
                              text-primary hover:bg-primary hover:text-white transition">
                        Detalhes
                    </a>

                    <form method="POST"
                          action="{% url 'deletar_tarefa' tarefa.id %}"
                          onsubmit="return confirm('Deseja realmente apagar esta tarefa?');">
                        {% csrf_token %}
                        <button type="submit"
                                class="px-4 py-2 rounded-lg border border-red-600
                                       text-red-400 hover:bg-red-600 hover:text-white transition">
                            Excluir
                        </button>
                    </form>
                </div>
            </li>

            {% empty %}
            <li class="text-center text-gray-400 py-10">
                Nenhuma tarefa cadastrada.
            </li>
            {% endfor %}
        </ul>

    </div>

</body>
</html>
